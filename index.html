<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSF Fire Safety Device</title>
  <!-- Import Lato Font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Global Reset & Apply Lato Font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lato', Arial, sans-serif;
    }

    /* Top Utility Bar */
    .top-bar {
      background-color: #1a1a1a;
      color: #fff;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    /* Pure Fade-In Animation for Top Bar Elements */
    .info-item, .top-bar-right > a {
      opacity: 0;
      animation: pureFadeIn 1s ease forwards;
    }

    .top-bar-left .info-item:nth-child(1) { animation-delay: 0.1s; }
    .top-bar-left .info-item:nth-child(2) { animation-delay: 0.25s; }
    .top-bar-left .info-item:nth-child(3) { animation-delay: 0.4s; }
    .top-bar-right a:nth-child(1) { animation-delay: 0.55s; }
    .top-bar-right a:nth-child(2) { animation-delay: 0.7s; }

    @keyframes pureFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    .info-item img {
      width: 20px;
      height: 20px;
      filter: invert(1);
    }

    .top-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }

    .btn-contact {
      background-color: #d93830;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .btn-contact:hover {
      background-color: #b52b24;
    }

    /* Main Header & Navigation Bar */
    .main-header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Logo Container with Pure Fade-In */
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      opacity: 0;
      animation: pureFadeIn 1s ease 0.2s forwards;
    }

    .logo img {
      height: 75px;
      width: auto;
      max-width: 280px;
      display: block !important;
      visibility: visible !important;
      object-fit: contain;
    }

    .logo-text {
      font-size: 26px;
      font-weight: 700;
      color: #d93830;
      letter-spacing: 0.5px;
    }

    /* Right side container for nav + get quote button */
    .header-right-group {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    /* Slide-in from Left & Fade-In Animation for Navigation Menu items (Home to AMC) */
    @keyframes slideInFromLeft {
      0% {
        opacity: 0;
        transform: translateX(-40px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-links li {
      opacity: 0;
      animation: slideInFromLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .nav-links li:nth-child(1) { animation-delay: 0.3s; }  /* Home */
    .nav-links li:nth-child(3) { animation-delay: 0.45s; } /* About */
    .nav-links li:nth-child(5) { animation-delay: 0.6s; }  /* Products */
    .nav-links li:nth-child(7) { animation-delay: 0.75s; } /* AMC */

    .divider {
      color: #ccc;
      font-size: 18px;
      font-weight: 400;
      opacity: 0;
      animation: pureFadeIn 0.8s ease forwards;
    }

    .nav-links span:nth-of-type(1) { animation-delay: 0.37s; }
    .nav-links span:nth-of-type(2) { animation-delay: 0.52s; }
    .nav-links span:nth-of-type(3) { animation-delay: 0.67s; }

    .nav-links li a {
      text-decoration: none;
      color: #333;
      font-size: 17px;
      font-weight: 700;
      padding: 5px 10px;
      transition: color 0.3s ease;
    }

    .nav-links li a:hover {
      color: #d93830;
    }

    /* Get Quote Button Pure Fade-In */
    .btn-get-quote {
      background-color: #d93830;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      opacity: 0;
      animation: pureFadeIn 0.9s ease 0.85s forwards;
      transition: background-color 0.3s ease;
    }

    .btn-get-quote:hover {
      background-color: #b52b24;
    }

    /* Hamburger Menu Toggle (Hidden on PC) */
    .menu-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 6px;
    }

    .menu-toggle span {
      width: 30px;
      height: 3px;
      background-color: #333;
      border-radius: 2px;
    }

    /* Mobile Responsiveness & Slide-Down Animation */
    @media (max-width: 950px) {
      .top-bar {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .top-bar-left {
        justify-content: center;
      }

      .menu-toggle {
        display: flex;
      }

      .logo img {
        height: 60px;
      }

      .header-right-group {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #ffffff;
        border-bottom: 1px solid #e0e0e0;
        flex-direction: column;
        align-items: center;
        padding: 0;
        max-height: 0;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: max-height 0.4s ease-in-out, padding 0.4s ease-in-out;
      }

      .header-right-group.active {
        max-height: 350px;
        padding: 20px;
        gap: 15px;
      }

      .nav-links {
        flex-direction: column;
        width: 100%;
        gap: 0;
      }

      .nav-links li {
        width: 100%;
        padding: 10px 0;
        border-bottom: 1px solid #f0f0f0;
        text-align: center;
        animation: none; /* Reset animation for mobile dropdown view */
        opacity: 1;
      }

      .divider {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Utility Bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <a href="tel:9818701683" class="info-item">
        <img src="call.png" alt="Phone Icon"> 9818701683
      </a>
      <a href="mailto:dssafety@hotmail.com" class="info-item">
        <img src="email.png" alt="Email Icon"> dssafety@hotmail.com
      </a>
      <div class="info-item">
        <img src="pin.png" alt="Location Icon"> Govind Puri, New Delhi
      </div>
    </div>
    <div class="top-bar-right">
      <a href="#">Client Portal</a>
      <a href="#" class="btn-contact">Contact Us</a>
    </div>
  </div>

  <!-- Main Navigation Header -->
  <header class="main-header">
    <!-- Logo with logo.png file name -->
    <a href="#" class="logo">
      <img src="logo.png" alt="DSF Fire Safety Device Logo" onerror="this.style.display='none'; document.getElementById('fallback-logo-text').style.display='inline-block';">
      <span id="fallback-logo-text" class="logo-text" style="display: none;">DSF Fire Safety</span>
    </a>
    
    <!-- Hamburger Toggle Button for Mobile -->
    <div class="menu-toggle" id="mobile-menu">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Navigation Links (Home to AMC) with Slide-In From Left Animation -->
    <div class="header-right-group" id="header-group">
      <ul class="nav-links" id="nav-list">
        <li><a href="#">Home</a></li><span class="divider">|</span>
        <li><a href="#">About</a></li><span class="divider">|</span>
        <li><a href="#">Products</a></li><span class="divider">|</span>
        <li><a href="#">AMC</a></li>
      </ul>
      <a href="#" class="btn-get-quote">Get Quote</a>
    </div>
  </header>

  <!-- JavaScript to Handle Smooth Mobile Menu Animation -->
  <script>
    const mobileMenu = document.getElementById('mobile-menu');
    const headerGroup = document.getElementById('header-group');

    mobileMenu.addEventListener('click', () => {
      headerGroup.classList.toggle('active');
    });
  </script>

</body>
</html>
