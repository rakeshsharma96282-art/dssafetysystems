<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS Safety Header Example</title>
  <style>
    /* Global Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Top Utility Bar */
    .top-bar {
      background-color: #1a1a1a;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .top-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    .btn-contact {
      background-color: #d93830;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
    }

    /* Main Header & Navigation Bar */
    .main-header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }

    /* Navigation Links */
    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links li a {
      text-decoration: none;
      color: #333;
      font-size: 15px;
      font-weight: 500;
    }

    .nav-links li a:hover {
      color: #d93830;
    }

    /* Hamburger Menu Toggle (Hidden on PC) */
    .menu-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .menu-toggle span {
      width: 25px;
      height: 3px;
      background-color: #333;
      border-radius: 2px;
    }

    /* Mobile Responsiveness */
    @media (max-width: 900px) {
      .top-bar {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .menu-toggle {
        display: flex;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #ffffff;
        border-bottom: 1px solid #e0e0e0;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        gap: 15px;
      }

      .nav-links.active {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Top Utility Bar without emojis -->
  <div class="top-bar">
    <div class="top-bar-left">
      <span>9818701683</span>
      <span>dssafety@hotmail.com</span>
      <span>Govind Puri, New Delhi</span>
    </div>
    <div class="top-bar-right">
      <a href="#">Client Portal</a>
      <a href="#" class="btn-contact">Contact Us</a>
    </div>
  </div>

  <!-- Main Navigation Header -->
  <header class="main-header">
    <a href="#" class="logo">DS Safety</a>
    
    <!-- Hamburger Toggle Button for Mobile -->
    <div class="menu-toggle" id="mobile-menu">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Navigation Links -->
    <ul class="nav-links" id="nav-list">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Our Services</a></li>
      <li><a href="#">Safety Info</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </header>

  <!-- JavaScript to Handle Mobile Menu Toggle -->
  <script>
    const mobileMenu = document.getElementById('mobile-menu');
    const navList = document.getElementById('nav-list');

    mobileMenu.addEventListener('click', () => {
      navList.classList.toggle('active');
    });
  </script>

</body>
</html>
