<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSF Fire Safety Device</title>
  <!-- Import Lato Font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Global Reset & Apply Lato Font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lato', Arial, sans-serif;
    }

    /* Top Utility Bar (Enlarged text size) */
    .top-bar {
      background-color: #1a1a1a;
      color: #fff;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 16px; /* Increased size */
      font-weight: 700;
      text-decoration: none;
    }

    .info-item img {
      width: 20px; /* Increased icon size */
      height: 20px;
      filter: invert(1);
    }

    .top-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }

    .btn-contact {
      background-color: #d93830;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .btn-contact:hover {
      background-color: #b52b24;
    }

    /* Main Header & Navigation Bar */
    .main-header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Logo Image Style */
    .logo img {
      height: 65px;
      width: auto;
      display: block;
    }

    /* Navigation Links with divider lines */
    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-links li a {
      text-decoration: none;
      color: #333;
      font-size: 17px;
      font-weight: 700;
      padding: 5px 10px;
      transition: color 0.3s ease;
    }

    .nav-links li a:hover {
      color: #d93830;
    }

    .divider {
      color: #ccc;
      font-size: 18px;
      font-weight: 400;
    }

    /* Hamburger Menu Toggle (Hidden on PC) */
    .menu-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 6px;
    }

    .menu-toggle span {
      width: 30px;
      height: 3px;
      background-color: #333;
      border-radius: 2px;
    }

    /* Mobile Responsiveness & Slide-Down Animation */
    @media (max-width: 900px) {
      .top-bar {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .top-bar-left {
        justify-content: center;
      }

      .menu-toggle {
        display: flex;
      }

      .nav-links {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #ffffff;
        border-bottom: 1px solid #e0e0e0;
        padding: 0;
        max-height: 0;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        gap: 0;
        /* Smooth animation for menu open/close */
        transition: max-height 0.4s ease-in-out, padding 0.4s ease-in-out;
      }

      .nav-links.active {
        max-height: 400px; /* Expands smoothly to fit links */
        padding: 20px;
      }

      .nav-links li {
        width: 100%;
        padding: 10px 0;
        border-bottom: 1px solid #f0f0f0;
      }

      .nav-links li:last-child {
        border-bottom: none;
      }

      /* Hide inline dividers on mobile view */
      .divider {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Utility Bar with enlarged text and custom icons -->
  <div class="top-bar">
    <div class="top-bar-left">
      <a href="tel:9818701683" class="info-item">
        <img src="call.png" alt="Phone Icon"> 9818701683
      </a>
      <a href="mailto:dssafety@hotmail.com" class="info-item">
        <img src="email.png" alt="Email Icon"> dssafety@hotmail.com
      </a>
      <div class="info-item">
        <img src="pin.png" alt="Location Icon"> Govind Puri, New Delhi
      </div>
    </div>
    <div class="top-bar-right">
      <a href="#">Client Portal</a>
      <a href="#" class="btn-contact">Contact Us</a>
    </div>
  </div>

  <!-- Main Navigation Header -->
  <header class="main-header">
    <!-- Logo on Left Upper -->
    <a href="#" class="logo">
      <img src="logo.png" alt="DSF Fire Safety Device Logo">
    </a>
    
    <!-- Hamburger Toggle Button for Mobile -->
    <div class="menu-toggle" id="mobile-menu">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Navigation Links with Divider Lines -->
    <ul class="nav-links" id="nav-list">
      <li><a href="#">Home</a></li><span class="divider">|</span>
      <li><a href="#">About</a></li><span class="divider">|</span>
      <li><a href="#">Our Services</a></li><span class="divider">|</span>
      <li><a href="#">Safety Info</a></li><span class="divider">|</span>
      <li><a href="#">Blog</a></li><span class="divider">|</span>
      <li><a href="#">Contact</a></li>
    </ul>
  </header>

  <!-- JavaScript to Handle Smooth Mobile Menu Animation -->
  <script>
    const mobileMenu = document.getElementById('mobile-menu');
    const navList = document.getElementById('nav-list');

    mobileMenu.addEventListener('click', () => {
      navList.classList.toggle('active');
    });
  </script>

</body>
</html>
