<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS Safety Systems | Home</title>
  <!-- Import Outfit Font (Weight 700) and Lato -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Global Reset & Apply Font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lato', Arial, sans-serif;
    }

    /* Top Utility Bar */
    .top-bar {
      background-color: #1a1a1a;
      color: #fff;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .info-item, .top-bar-right > a {
      opacity: 0;
      animation: pureFadeIn 1.1s ease forwards;
    }

    .top-bar-left .info-item:nth-child(1) { animation-delay: 0.1s; }
    .top-bar-left .info-item:nth-child(2) { animation-delay: 0.25s; }
    .top-bar-left .info-item:nth-child(3) { animation-delay: 0.4s; }
    .top-bar-right a:nth-child(1) { animation-delay: 0.55s; }
    .top-bar-right a:nth-child(2) { animation-delay: 0.7s; }

    @keyframes pureFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    .info-item img {
      width: 20px;
      height: 20px;
      filter: invert(1);
    }

    .top-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }

    .btn-contact {
      background-color: #d93830;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .btn-contact:hover {
      background-color: #b52b24;
    }

    /* Main Navigation Header */
    .main-header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      opacity: 0;
      animation: pureFadeIn 1.1s ease 0.2s forwards;
    }

    .logo-container img {
      height: 85px;
      width: auto;
      display: block !important;
      visibility: visible !important;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(217, 56, 48, 0.25));
    }

    /* Single-line text with subtle black shadow & red glow */
    .brand-single-line {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 37.5px;
      color: #e63930;
      letter-spacing: 2px;
      white-space: nowrap;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.25), 0 0 6px rgba(230, 57, 48, 0.35);
    }

    .header-right-group {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    @keyframes slideInFromLeft {
      0% { opacity: 0; transform: translateX(-40px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-links li {
      opacity: 0;
      animation: slideInFromLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .nav-links li:nth-child(1) { animation-delay: 0.3s; }
    .nav-links li:nth-child(3) { animation-delay: 0.45s; }
    .nav-links li:nth-child(5) { animation-delay: 0.6s; }
    .nav-links li:nth-child(7) { animation-delay: 0.75s; }

    .divider {
      color: #ccc;
      font-size: 18px;
      font-weight: 400;
      opacity: 0;
      animation: pureFadeIn 0.8s ease forwards;
    }

    .nav-links span:nth-of-type(1) { animation-delay: 0.37s; }
    .nav-links span:nth-of-type(2) { animation-delay: 0.52s; }
    .nav-links span:nth-of-type(3) { animation-delay: 0.67s; }

    .nav-links li a {
      text-decoration: none;
      color: #333;
      font-size: 17px;
      font-weight: 700;
      padding: 5px 10px;
      transition: color 0.3s ease;
    }

    .nav-links li a:hover {
      color: #d93830;
    }

    .btn-get-quote {
      background-color: #d93830;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      opacity: 0;
      animation: pureFadeIn 0.9s ease 0.85s forwards;
      transition: background-color 0.3s ease;
    }

    .btn-get-quote:hover {
      background-color: #b52b24;
    }

    .menu-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 6px;
    }

    .menu-toggle span {
      width: 30px;
      height: 3px;
      background-color: #333;
      border-radius: 2px;
    }

    /* Mobile Responsiveness */
    @media (max-width: 1200px) {
      .top-bar { flex-direction: column; text-align: center; }
      .top-bar-left { justify-content: center; }
      .menu-toggle { display: flex; }
      .logo-container img { height: 55px; }
      .brand-single-line { font-size: 20px; letter-spacing: 1px; }
      
      .header-right-group {
        position: absolute; 
        top: 100%; 
        left: 0; 
        width: 100%;
        background-color: #ffffff; 
        flex-direction: column;
        padding: 0; 
        max-height: 0; 
        overflow: hidden;
        box-shadow: 0 10px 15px rgba(0,0,0,0.05);
        transition: max-height 0.4s ease-in-out, padding 0.4s ease-in-out, border-bottom 0.4s ease-in-out;
        z-index: 10;
      }
      .header-right-group.active { 
        max-height: 350px; 
        padding: 20px; 
        gap: 15px; 
        border-bottom: 1px solid #e0e0e0;
      }
      .nav-links { flex-direction: column; width: 100%; gap: 0; }
      .nav-links li { width: 100%; padding: 10px 0; border-bottom: 1px solid #f0f0f0; text-align: center; animation: none; opacity: 1; }
      .divider { display: none; }
      .btn-get-quote { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Top Utility Bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <a href="tel:9818701683" class="info-item">
        <img src="call.png" alt="Phone"> 9818701683
      </a>
      <a href="mailto:Dssafetysystems@hotmail.com" class="info-item">
        <img src="email.png" alt="Email"> Dssafetysystems@hotmail.com
      </a>
      <div class="info-item">
        <img src="pin.png" alt="Location"> Govind Puri, New Delhi
      </div>
    </div>
    <div class="top-bar-right">
      <a href="#">Client Portal</a>
      <a href="tel:9818701683" class="btn-contact">Contact Us</a>
    </div>
  </div>

  <!-- Main Navigation Header -->
  <header class="main-header">
    <a href="#" class="logo-container">
      <img src="logo.png" alt="DSF Fire Safety Logo" onerror="this.style.display='none';">
      <span class="brand-single-line">DS SAFETY SYSTEMS</span>
    </a>
    
    <div class="menu-toggle" id="mobile-menu">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="header-right-group" id="header-group">
      <ul class="nav-links">
        <li><a href="#">Home</a></li><span class="divider">|</span>
        <li><a href="#">About Us</a></li><span class="divider">|</span>
        <li><a href="#">Products</a></li><span class="divider">|</span>
        <li><a href="#">AMC</a></li>
      </ul>
      <a href="#" class="btn-get-quote">Get Quote</a>
    </div>
  </header>

  <!-- JavaScript for Mobile Menu -->
  <script>
    const mobileMenu = document.getElementById('mobile-menu');
    const headerGroup = document.getElementById('header-group');

    mobileMenu.addEventListener('click', () => {
      headerGroup.classList.toggle('active');
    });
  </script>

</body>
</html>
